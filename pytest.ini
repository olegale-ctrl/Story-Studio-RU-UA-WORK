[pytest]
testpaths = tests
norecursedirs = .git .venv venv upstream build dist

# Windows note: pytest builds its temporary directory from %TEMP%, which
# normally contains the user profile name. With a non-ASCII profile name
# (for example C:\Temp\pytest-of-<Cyrillic>) the resulting path cannot be
# scanned and every test that uses the tmp_path fixture fails with
# PermissionError. This is a pytest/tempdir issue, not a project defect.
#
# Workaround for a local Windows run:
#   python -m pytest -q tests --basetemp C:\Temp\pytest_ascii
#
# The standard library runner is not affected:
#   python -m unittest discover -s tests -v
