name: RU-UA Python unit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unittest:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
          persist-credentials: false
      - name: Record and verify tested SHA
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg for local media regression tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python test runner
        run: python -m pip install 'pytest>=8,<10'
      - name: Verify runtime tools
        run: |
          python --version
          ffmpeg -version
          ffprobe -version
          python -m pytest --version
      - name: Run stdlib Python tests
        run: python -m unittest discover -s tests -v
      - name: Run full pytest suite
        run: python -m pytest -q tests
