name: RU-UA Python unit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: da1d3dd2ad6a55943e88503f5231f4c34a1e4e5f
          persist-credentials: false
          submodules: false
      - name: Verify source SHA
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "da1d3dd2ad6a55943e88503f5231f4c34a1e4e5f"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg for local media regression tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python test runner
        run: python -m pip install 'pytest>=8,<10'
      - name: Record versions
        run: |
          python --version
          ffmpeg -version
          ffprobe -version
          python -m pytest --version
      - name: Run stdlib Python tests
        run: python -m unittest discover -s tests -v
      - name: Run full pytest suite
        run: python -m pytest -q tests
