name: RU-UA Python unit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg for local media regression tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python test runner
        run: python -m pip install 'pytest>=8,<10'
      - name: Run stdlib Python tests
        run: python -m unittest discover -s tests -v
      - name: Run full pytest suite
        run: python -m pytest -q tests
      - name: Verify SBOM matches the audited license registers
        run: python scripts/generate_sbom.py --check

  windows:
    # The primary target platform. Runs the same suite on Windows 11 to catch
    # path, encoding and subprocess differences that the Linux job cannot see.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg for local media regression tests
        run: choco install ffmpeg --no-progress -y
      - name: Run stdlib Python tests
        run: python -m unittest discover -s tests -v
      # The pytest temporary directory inherits the runner user profile name.
      # An ASCII base directory keeps the tmp_path fixture usable on Windows.
      - name: Run full pytest suite
        run: python -m pytest -q tests --basetemp ${{ runner.temp }}\pytest-ascii
      - name: Verify SBOM matches the audited license registers
        run: python scripts/generate_sbom.py --check
